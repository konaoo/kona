<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>咔咔记账 - 投资记录工具</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
      }

      html.portal-boot,
      html.portal-boot body,
      html.portal-boot #app {
        background:
          radial-gradient(900px 600px at 18% 18%, rgba(255, 120, 80, 0.2), transparent 60%),
          radial-gradient(860px 640px at 82% 22%, rgba(255, 60, 160, 0.16), transparent 58%),
          radial-gradient(860px 620px at 70% 92%, rgba(99, 102, 241, 0.18), transparent 55%),
          linear-gradient(135deg, #fff7f1 0%, #f2f7ff 55%, #f6f2ff 100%) !important;
      }
    </style>
    <script>
      (function () {
        var path = window.location.pathname || '/'
        if (path === '/' || path === '/index.html') {
          document.documentElement.classList.add('portal-boot')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
