name: Deploy to Production

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-guard:
    name: Repo Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Repo hygiene guard
        run: bash scripts/ci/check_repo_hygiene.sh

      - name: Deploy scripts guard
        run: bash scripts/ci/check_deploy_scripts.sh

      - name: Sync contract guard
        run: bash scripts/ci/check_sync_contract_generated.sh

      - name: CHANGELOG guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          BASE_SHA="$PUSH_BEFORE_SHA"
          HEAD_SHA="$CURRENT_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          fi
          bash scripts/ci/check_changelog_guard.sh "$BASE_SHA" "$HEAD_SHA"

  detect_changes:
    name: Detect Changes
    needs: [ repo-guard ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      web: ${{ steps.scope.outputs.web }}
      flutter: ${{ steps.scope.outputs.flutter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: scope
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'kona_tool/**'
              - 'scripts/deploy/deploy_backend.sh'
            web:
              - 'web/**'
              - 'scripts/deploy/upload_web_artifact.sh'
              - 'scripts/deploy/apply_web_artifact.sh'
            flutter:
              - 'flutter/**'

      - name: Print scope
        run: |
          echo "backend changed -> ${{ steps.scope.outputs.backend }}"
          echo "web changed -> ${{ steps.scope.outputs.web }}"
          echo "flutter changed -> ${{ steps.scope.outputs.flutter }}"

  backend_gate:
    name: Backend Gate (Python ${{ matrix.python-version }})
    needs: [ repo-guard, detect_changes ]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect_changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11" ]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: kona_tool/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kona_tool/requirements.txt

      - name: Compile check
        run: python -m compileall -q kona_tool

      - name: Run backend unit tests
        env:
          JWT_SECRET: ci_dummy_secret_for_tests_only
          PYTHONPATH: kona_tool
          KONA_DATABASE_PATH: /tmp/kona_ci.db
        run: python -m unittest discover -s kona_tool/tests -p "test_*.py" -v

  flutter_gate:
    name: Flutter Gate
    needs: [ repo-guard, detect_changes ]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect_changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java (Gradle cache)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Flutter analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test
        working-directory: flutter
        run: flutter test

      - name: Flutter build apk (debug smoke)
        working-directory: flutter
        run: flutter build apk --debug

  web_gate:
    name: Web Gate
    needs: [ repo-guard, detect_changes ]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect_changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python for Web smoke
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: kona_tool/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Run Web unit tests
        working-directory: web
        run: npm run test

      - name: Build Web
        working-directory: web
        run: npm run build

      - name: Package Web artifact
        working-directory: web
        run: |
          set -eu
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C dist -czf ../web-dist.tar.gz .
          gzip -t ../web-dist.tar.gz

      - name: Upload Web artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web-dist.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Install backend dependencies for Web smoke
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kona_tool/requirements.txt

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run Web e2e smoke
        working-directory: web
        env:
          CI: true
        run: npm run test:e2e

  deploy_backend:
    name: Deploy Backend
    needs: [ detect_changes, backend_gate ]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.backend == 'true') &&
      needs.backend_gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy backend via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST or SSH_KEY secret."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_OPTS="-i $KEY_FILE -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"

          ssh $SSH_OPTS root@"$SSH_HOST" "APP_DIR='$APP_DIR' TARGET_SHA='$TARGET_SHA' bash -s" < scripts/deploy/deploy_backend.sh

  deploy_web:
    name: Deploy Web
    needs: [ detect_changes, web_gate ]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.web == 'true') &&
      needs.web_gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REMOTE_WEB_ARCHIVE: /tmp/web-dist-${{ github.sha }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Web artifact
        uses: actions/download-artifact@v5
        with:
          name: web-dist-${{ github.sha }}
          path: /tmp/kona-web-artifact

      - name: Upload Web artifact to server (with retries)
        timeout-minutes: 4
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
        run: |
          WEB_ARCHIVE="/tmp/kona-web-artifact/web-dist.tar.gz" bash scripts/deploy/upload_web_artifact.sh

      - name: Apply Web artifact on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          set -eu

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing SSH_HOST or SSH_KEY secret."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SSH_OPTS="-i $KEY_FILE -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ConnectionAttempts=2 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"

          ssh $SSH_OPTS root@"$SSH_HOST" "APP_DIR='$APP_DIR' REMOTE_WEB_ARCHIVE='$REMOTE_WEB_ARCHIVE' bash -s" < scripts/deploy/apply_web_artifact.sh
