name: Deploy to AWS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-gate:
    name: Backend Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.11" ]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: kona_tool/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kona_tool/requirements.txt

      - name: Compile check
        run: python -m compileall -q kona_tool

      - name: Run backend unit tests
        env:
          JWT_SECRET: ci_dummy_secret_for_tests_only
          PYTHONPATH: kona_tool
          KONA_DATABASE_PATH: /tmp/kona_ci.db
        run: python -m unittest discover -s kona_tool/tests -p "test_*.py" -v

  frontend-gate:
    name: Frontend Gate (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Detect Android-impacting changes
        id: apk_scope
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apk:
              - 'flutter/android/**'

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Flutter analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test
        working-directory: flutter
        run: flutter test

      - name: Flutter build apk (debug smoke)
        if: steps.apk_scope.outputs.apk == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: flutter
        run: flutter build apk --debug

      - name: Flutter build web
        working-directory: flutter
        run: flutter build web --release --base-href /app/

      - name: Package Flutter Web artifact
        run: tar -C flutter/build/web -czf flutter-web.tar.gz .

      - name: Upload Flutter Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-dist
          path: flutter-web.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to AWS
    needs: [ backend-gate, frontend-gate ]
    if: >-
      github.event_name != 'pull_request' &&
      needs.backend-gate.result == 'success' &&
      needs.frontend-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Flutter Web artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-dist
          path: .

      - name: Upload Flutter Web artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          source: flutter-web.tar.gz
          target: /tmp

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu

            APP_DIR="${{ secrets.APP_DIR }}"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              echo "Invalid APP_DIR: $APP_DIR"
              exit 1
            fi

            WEB_DIR="$APP_DIR/static/app"
            if [ ! -f "$APP_DIR/app.py" ] && [ -d "$APP_DIR/kona_tool" ]; then
              WEB_DIR="$APP_DIR/kona_tool/static/app"
            fi
            mkdir -p "$WEB_DIR"
            if [ ! -f /tmp/flutter-web.tar.gz ]; then
              echo "Missing /tmp/flutter-web.tar.gz"
              exit 1
            fi
            rm -rf "$WEB_DIR"/*
            tar -xzf /tmp/flutter-web.tar.gz -C "$WEB_DIR"
            rm -f /tmp/flutter-web.tar.gz

            cd "$APP_DIR"
            echo "Deploy dir: $(pwd)"
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git fetch origin main
              git reset --hard origin/main
            else
              echo "WARN: $APP_DIR is not a git repository, skip git sync."
            fi

            REQ_FILE="requirements.txt"
            if [ ! -f "$REQ_FILE" ] && [ -f "kona_tool/requirements.txt" ]; then
              REQ_FILE="kona_tool/requirements.txt"
            fi
            if [ ! -f "$REQ_FILE" ]; then
              echo "requirements file not found in $APP_DIR"
              exit 1
            fi
            python3 -m pip install --user -r "$REQ_FILE"

            if ! sudo test -f /etc/systemd/system/kona.service; then
              echo "Missing /etc/systemd/system/kona.service on server."
              echo "Please bootstrap service unit once, then re-run deploy."
              exit 1
            fi
            echo "Existing /etc/systemd/system/kona.service detected, keep current unit."
            sudo systemctl restart kona

            i=1
            while [ "$i" -le 60 ]; do
              status=$(curl -sS -o /tmp/kona_health.json -w "%{http_code}" --max-time 2 http://127.0.0.1:5003/health || true)
              echo "health attempt $i -> $status"
              if [ "$status" = "200" ]; then
                cat /tmp/kona_health.json || true
                echo
                echo "Health check passed."
                break
              fi
              i=$((i + 1))
              sleep 1
            done

            if [ "$i" -gt 60 ]; then
              echo "Health check failed after restart."
              sudo systemctl status kona -l --no-pager || true
              sudo journalctl -u kona -n 120 --no-pager || true
              exit 1
            fi

            echo "Running post-deploy API smoke checks..."
            market_status=$(curl -sS -o /tmp/kona_market_status.json -w "%{http_code}" --max-time 3 http://127.0.0.1:5003/api/market/status || true)
            echo "market status -> $market_status"
            if [ "$market_status" != "200" ]; then
              echo "ERROR: /api/market/status unexpected status: $market_status"
              cat /tmp/kona_market_status.json || true
              exit 1
            fi
            python3 -c "import json; data=json.load(open('/tmp/kona_market_status.json','r',encoding='utf-8')); required=['server_time_utc','markets','all_closed']; missing=[k for k in required if k not in data]; assert not missing, f'missing keys in /api/market/status: {missing}'; print('market status payload OK')"

            login_status=$(curl -sS -o /tmp/kona_login_probe.json -w "%{http_code}" --max-time 3 \
              -H 'Content-Type: application/json' \
              -X POST 'http://127.0.0.1:5003/api/auth/login' \
              --data '{"username":"ci_probe_user","password":"ci_probe_bad_password"}' || true)
            echo "login probe -> $login_status"
            if [ "$login_status" != "401" ]; then
              echo "ERROR: /api/auth/login probe unexpected status: $login_status"
              cat /tmp/kona_login_probe.json || true
              exit 1
            fi
            python3 -c "import json; data=json.load(open('/tmp/kona_login_probe.json','r',encoding='utf-8')); assert 'error' in data, 'missing error field in /api/auth/login probe response'; print('login probe payload OK')"

            app_js_headers=$(curl -sS -I --max-time 3 http://127.0.0.1:5003/app/main.dart.js | tr -d '\r' || true)
            echo "$app_js_headers" | sed -n '1,20p'
            if echo "$app_js_headers" | grep -qi '^Cache-Control:.*immutable'; then
              echo "ERROR: /app/main.dart.js should not be immutable-cached"
              exit 1
            fi
            echo "Post-deploy smoke checks passed."
