name: Deploy to Production

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-gate:
    name: Backend Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.11" ]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: kona_tool/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r kona_tool/requirements.txt

      - name: Compile check
        run: python -m compileall -q kona_tool

      - name: Run backend unit tests
        env:
          JWT_SECRET: ci_dummy_secret_for_tests_only
          PYTHONPATH: kona_tool
          KONA_DATABASE_PATH: /tmp/kona_ci.db
        run: python -m unittest discover -s kona_tool/tests -p "test_*.py" -v

  frontend-gate:
    name: Frontend Gate (Flutter + Web)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Gradle cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Detect Android-impacting changes
        id: apk_scope
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apk:
              - 'flutter/android/**'

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Flutter analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test
        working-directory: flutter
        run: flutter test

      - name: Flutter build apk (debug smoke)
        if: steps.apk_scope.outputs.apk == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: flutter
        run: flutter build apk --debug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Build Web
        working-directory: web
        run: npm run build

      - name: Package Web artifact
        run: tar -C web/dist -czf web-dist.tar.gz .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-dist.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Production
    needs: [ backend-gate, frontend-gate ]
    if: >-
      github.event_name != 'pull_request' &&
      needs.backend-gate.result == 'success' &&
      needs.frontend-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .

      - name: Upload Web artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: web-dist.tar.gz
          target: /tmp

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu

            APP_DIR="${{ secrets.APP_DIR }}"
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              echo "Invalid APP_DIR: $APP_DIR"
              exit 1
            fi

            WEB_DIR="$APP_DIR/static/web"
            if [ ! -f "$APP_DIR/app.py" ] && [ -d "$APP_DIR/kona_tool" ]; then
              WEB_DIR="$APP_DIR/kona_tool/static/web"
            fi

            cd "$APP_DIR"
            echo "Deploy dir: $(pwd)"
            git config --global --add safe.directory "$APP_DIR"
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              FETCH_OK=0
              for attempt in 1 2 3 4 5; do
                echo "git fetch attempt $attempt ..."
                # 强制 HTTP/1.1，规避部分环境下 fetch 的偶发空响应
                if git -c http.version=HTTP/1.1 fetch --depth=1 origin main; then
                  FETCH_OK=1
                  break
                fi
                sleep 2
              done
              if [ "$FETCH_OK" -ne 1 ]; then
                echo "ERROR: git fetch origin main failed after retries."
                echo "Please check server outbound network to github.com:443."
                exit 1
              fi
              git reset --hard origin/main
            else
              echo "WARN: $APP_DIR is not a git repository, skip git sync."
            fi

            REQ_FILE="requirements.txt"
            if [ ! -f "$REQ_FILE" ] && [ -f "kona_tool/requirements.txt" ]; then
              REQ_FILE="kona_tool/requirements.txt"
            fi
            if [ ! -f "$REQ_FILE" ]; then
              echo "requirements file not found in $APP_DIR"
              exit 1
            fi
            PYTHON_BIN="python3"
            if [ -f "kona_tool/.venv/bin/python3" ]; then
              PYTHON_BIN="kona_tool/.venv/bin/python3"
            elif [ -f ".venv/bin/python3" ]; then
              PYTHON_BIN=".venv/bin/python3"
            fi
            
            if [ "$PYTHON_BIN" != "python3" ]; then
              $PYTHON_BIN -m pip install -r "$REQ_FILE"
            else
              $PYTHON_BIN -m pip install --user -r "$REQ_FILE"
            fi

            if [ ! -f /tmp/web-dist.tar.gz ]; then
              echo "Missing /tmp/web-dist.tar.gz"
              exit 1
            fi
            TMP_WEB_DIR="$(mktemp -d)"
            tar -xzf /tmp/web-dist.tar.gz -C "$TMP_WEB_DIR"
            rm -f /tmp/web-dist.tar.gz
            BACKUP_WEB_DIR="${WEB_DIR}.bak.$(date +%s)"
            if [ -d "$WEB_DIR" ]; then
              cp -a "$WEB_DIR" "$BACKUP_WEB_DIR"
            fi
            rm -rf "$WEB_DIR"
            mkdir -p "$WEB_DIR"
            cp -a "$TMP_WEB_DIR"/. "$WEB_DIR"/
            rm -rf "$TMP_WEB_DIR"
            rollback_web() {
              if [ -d "$BACKUP_WEB_DIR" ]; then
                echo "Rolling back web artifact from $BACKUP_WEB_DIR ..."
                rm -rf "$WEB_DIR"
                cp -a "$BACKUP_WEB_DIR" "$WEB_DIR"
                sudo systemctl restart kona || true
              else
                echo "No web backup directory found, skip rollback."
              fi
            }

            if ! sudo test -f /etc/systemd/system/kona.service; then
              echo "Missing /etc/systemd/system/kona.service on server."
              echo "Please bootstrap service unit once, then re-run deploy."
              exit 1
            fi
            echo "Existing /etc/systemd/system/kona.service detected, keep current unit."
            sudo systemctl restart kona

            i=1
            while [ "$i" -le 60 ]; do
              status=$(curl -sS -o /tmp/kona_health.json -w "%{http_code}" --max-time 2 http://127.0.0.1:5003/health || true)
              echo "health attempt $i -> $status"
              if [ "$status" = "200" ]; then
                cat /tmp/kona_health.json || true
                echo
                echo "Health check passed."
                break
              fi
              i=$((i + 1))
              sleep 1
            done

            if [ "$i" -gt 60 ]; then
              echo "Health check failed after restart."
              sudo systemctl status kona -l --no-pager || true
              sudo journalctl -u kona -n 120 --no-pager || true
              exit 1
            fi

            echo "Running post-deploy API smoke checks..."
            web_root=$(curl -sS -o /tmp/kona_web_root.html -w "%{http_code}" --max-time 3 http://127.0.0.1:5003/ || true)
            app_login=$(curl -sS -o /tmp/kona_app_login.html -w "%{http_code}" --max-time 3 http://127.0.0.1:5003/app/login || true)
            admin_login=$(curl -sS -o /tmp/kona_admin_login.html -w "%{http_code}" --max-time 3 http://127.0.0.1:5003/admin/login || true)
            market_status=$(curl -sS -o /tmp/kona_market_status.json -w "%{http_code}" --max-time 3 http://127.0.0.1:5003/api/market/status || true)
            echo "web root -> $web_root"
            echo "app login -> $app_login"
            echo "admin login -> $admin_login"
            echo "market status -> $market_status"
            if [ "$web_root" != "200" ] || [ "$app_login" != "200" ] || [ "$admin_login" != "200" ]; then
              echo "ERROR: web smoke failed."
              rollback_web
              exit 1
            fi
            if [ "$market_status" != "200" ]; then
              echo "ERROR: /api/market/status unexpected status: $market_status"
              cat /tmp/kona_market_status.json || true
              rollback_web
              exit 1
            fi
            python3 -c "import json; data=json.load(open('/tmp/kona_market_status.json','r',encoding='utf-8')); required=['server_time_utc','markets','all_closed']; missing=[k for k in required if k not in data]; assert not missing, f'missing keys in /api/market/status: {missing}'; print('market status payload OK')"

            login_status=$(curl -sS -o /tmp/kona_login_probe.json -w "%{http_code}" --max-time 3 \
              -H 'Content-Type: application/json' \
              -X POST 'http://127.0.0.1:5003/api/auth/login' \
              --data '{"username":"ci_probe_user","password":"ci_probe_bad_password"}' || true)
            echo "login probe -> $login_status"
            if [ "$login_status" != "401" ]; then
              echo "ERROR: /api/auth/login probe unexpected status: $login_status"
              cat /tmp/kona_login_probe.json || true
              rollback_web
              exit 1
            fi
            python3 -c "import json; data=json.load(open('/tmp/kona_login_probe.json','r',encoding='utf-8')); assert 'error' in data, 'missing error field in /api/auth/login probe response'; print('login probe payload OK')"
            echo "Post-deploy smoke checks passed."
