<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin 登录</title>
    <style>
        :root {
            --bg-1: #0b1e2d;
            --bg-2: #14384f;
            --panel: rgba(255, 255, 255, 0.92);
            --text: #102132;
            --sub: #4c6277;
            --line: #d7e1ea;
            --primary: #0a5f73;
            --primary-hover: #0b748c;
            --danger: #b42318;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(1000px 500px at 5% 10%, rgba(255, 255, 255, 0.15), transparent 70%),
                radial-gradient(900px 420px at 100% 90%, rgba(255, 214, 102, 0.18), transparent 70%),
                linear-gradient(145deg, var(--bg-1), var(--bg-2));
            padding: 16px;
        }

        .card {
            width: min(420px, 100%);
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
        }

        .title {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .sub {
            margin: 6px 0 20px 0;
            color: var(--sub);
            font-size: 13px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--sub);
        }

        .field input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
            background: #fff;
        }

        .field input:focus {
            outline: none;
            border-color: #79a8c7;
            box-shadow: 0 0 0 3px rgba(121, 168, 199, 0.22);
        }

        .actions {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .error {
            margin-top: 12px;
            color: var(--danger);
            font-size: 13px;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="title">Admin 登录</h1>
        <p class="sub">使用管理员账号密码登录后台</p>
        <form id="loginForm">
            <div class="field">
                <label for="username">账号</label>
                <input id="username" name="username" autocomplete="username" required />
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
            <div class="actions">
                <button id="submitBtn" type="submit">登录后台</button>
            </div>
            <div id="errorText" class="error"></div>
        </form>
    </div>

    <script>
        const ADMIN_TOKEN_KEYS = ['token', 'kona_token', 'auth_token', 'jwt_token', 'admin_token'];

        function clearTokens() {
            for (const key of ADMIN_TOKEN_KEYS) {
                localStorage.removeItem(key);
                sessionStorage.removeItem(key);
            }
        }

        function setTokens(token) {
            localStorage.setItem('token', token);
            localStorage.setItem('admin_token', token);
        }

        function getNextPath() {
            const params = new URLSearchParams(window.location.search);
            const nextPath = params.get('next') || '/admin';
            if (!nextPath.startsWith('/admin')) return '/admin';
            return nextPath;
        }

        function setError(msg) {
            document.getElementById('errorText').innerText = msg || '';
        }

        async function verifyAdmin(token) {
            const resp = await fetch('/api/admin/overview', {
                headers: { Authorization: `Bearer ${token}` }
            });
            if (!resp.ok) {
                const payload = await resp.json().catch(() => ({}));
                const message = payload && payload.error ? payload.error : `HTTP ${resp.status}`;
                throw new Error(message);
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            setError('');
            const submitBtn = document.getElementById('submitBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                setError('请输入账号和密码');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = '登录中...';
            clearTokens();
            try {
                const loginResp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const loginPayload = await loginResp.json().catch(() => ({}));
                if (!loginResp.ok) {
                    throw new Error(loginPayload.error || '登录失败');
                }
                const token = loginPayload.access_token || '';
                if (!token) {
                    throw new Error('登录响应缺少 access_token');
                }

                await verifyAdmin(token);
                setTokens(token);
                window.location.href = getNextPath();
            } catch (e) {
                clearTokens();
                setError(e.message || '登录失败');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '登录后台';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', handleSubmit);
    </script>
</body>
</html>
