<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营后台登录</title>
    <style>
        :root {
            --bg-1: #0a2340;
            --bg-2: #0d3a56;
            --card: rgba(255, 255, 255, 0.93);
            --text: #10243f;
            --sub: #4b6783;
            --line: #d4e1ee;
            --brand: #0f5f73;
            --brand-2: #0a8f98;
            --danger: #b42318;
            --warn: #b54708;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
            color: var(--text);
            background:
                radial-gradient(980px 420px at 10% 4%, rgba(98, 179, 255, 0.22), transparent 68%),
                radial-gradient(900px 420px at 96% 96%, rgba(244, 172, 80, 0.16), transparent 64%),
                linear-gradient(150deg, var(--bg-1) 0%, var(--bg-2) 100%);
        }

        .card {
            width: min(430px, 100%);
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.52);
            border-radius: 18px;
            box-shadow: 0 28px 56px rgba(8, 21, 35, 0.28);
            backdrop-filter: blur(10px);
            padding: 22px;
        }

        .title {
            margin: 0;
            font-size: 26px;
            letter-spacing: 0.3px;
        }

        .sub {
            margin: 8px 0 18px;
            color: var(--sub);
            font-size: 13px;
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            color: #4b667f;
            font-size: 13px;
        }

        .field input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: #fff;
            font-size: 14px;
            color: var(--text);
        }

        .field input:focus {
            outline: none;
            border-color: #76a9ce;
            box-shadow: 0 0 0 3px rgba(84, 148, 193, 0.2);
        }

        .caps-hint {
            min-height: 18px;
            color: var(--warn);
            font-size: 12px;
        }

        .actions {
            margin-top: 16px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(120deg, var(--brand), var(--brand-2));
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            margin-top: 10px;
            color: var(--danger);
            min-height: 20px;
            white-space: pre-wrap;
            font-size: 13px;
        }

        .notice {
            margin-top: 12px;
            font-size: 12px;
            color: #5b7590;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="title">运营后台登录</h1>
        <p class="sub">请输入管理员账号与密码</p>

        <form id="loginForm">
            <div class="field">
                <label for="username">管理员账号</label>
                <input id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">登录密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <div id="capsHint" class="caps-hint"></div>
            <div class="actions">
                <button id="submitBtn" type="submit">登录后台</button>
            </div>
            <div id="errorText" class="error"></div>
        </form>

        <div class="notice">仅管理员账号可以访问运营后台。</div>
    </div>

    <script>
        const ADMIN_ACCESS_KEY = 'admin_access_token';
        const ADMIN_REFRESH_KEY = 'admin_refresh_token';
        const LEGACY_ADMIN_TOKEN_KEYS = ['admin_token', 'token', 'kona_token', 'auth_token', 'jwt_token'];

        function clearAdminTokens() {
            for (const key of [ADMIN_ACCESS_KEY, ADMIN_REFRESH_KEY, 'admin_token', ...LEGACY_ADMIN_TOKEN_KEYS]) {
                localStorage.removeItem(key);
                sessionStorage.removeItem(key);
            }
        }

        function setAdminTokens(accessToken, refreshToken) {
            if (accessToken) {
                localStorage.setItem(ADMIN_ACCESS_KEY, accessToken);
                localStorage.setItem('admin_token', accessToken);
            }
            if (refreshToken) {
                localStorage.setItem(ADMIN_REFRESH_KEY, refreshToken);
            }
        }

        function getStoredAdminAccessToken() {
            const direct = localStorage.getItem(ADMIN_ACCESS_KEY) || sessionStorage.getItem(ADMIN_ACCESS_KEY);
            if (direct) return direct;
            for (const key of LEGACY_ADMIN_TOKEN_KEYS) {
                const legacy = localStorage.getItem(key) || sessionStorage.getItem(key);
                if (legacy) return legacy;
            }
            return '';
        }

        function getStoredAdminRefreshToken() {
            return localStorage.getItem(ADMIN_REFRESH_KEY) || sessionStorage.getItem(ADMIN_REFRESH_KEY) || '';
        }

        function getNextPath() {
            const params = new URLSearchParams(window.location.search);
            const nextPath = params.get('next') || '/admin';
            if (!nextPath.startsWith('/admin')) return '/admin';
            return nextPath;
        }

        function mapError(message) {
            const text = String(message || '');
            const lower = text.toLowerCase();
            if (!text) return '登录失败，请稍后重试';
            if (text === 'Admin privileges required') return '当前账号不是管理员，无法进入后台';
            if (text === 'User is disabled') return '账号已停用，请联系管理员';
            if (text === 'Invalid or expired token' || text === 'Missing Authorization header') return '登录状态已过期，请重新登录';
            if (lower.includes('invalid username or password') || lower.includes('bad_password')) {
                return '账号或密码错误，请重新输入';
            }
            if (lower.includes('network') || lower.includes('failed to fetch')) {
                return '网络异常，请检查网络后重试';
            }
            return text;
        }

        function setError(msg) {
            document.getElementById('errorText').innerText = msg || '';
        }

        function updateCapsHint(event) {
            const hint = document.getElementById('capsHint');
            if (!hint) return;
            if (event && typeof event.getModifierState === 'function' && event.getModifierState('CapsLock')) {
                hint.innerText = '检测到大写锁定已开启，请确认密码大小写';
                return;
            }
            hint.innerText = '';
        }

        async function verifyAdmin(token) {
            const resp = await fetch('/api/admin/overview', {
                headers: { Authorization: `Bearer ${token}` },
            });
            if (!resp.ok) {
                const payload = await resp.json().catch(() => ({}));
                const message = payload && payload.error ? payload.error : `HTTP ${resp.status}`;
                throw new Error(message);
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            setError('');
            const submitBtn = document.getElementById('submitBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                setError('请输入管理员账号和密码');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = '登录中...';
            clearAdminTokens();
            try {
                const loginResp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, device_id: 'admin_web' }),
                });
                const payload = await loginResp.json().catch(() => ({}));
                if (!loginResp.ok) {
                    throw new Error(payload.error || '登录失败');
                }

                const accessToken = payload.access_token || '';
                const refreshToken = payload.refresh_token || '';
                if (!accessToken || !refreshToken) {
                    throw new Error('登录返回信息不完整，请重试');
                }

                await verifyAdmin(accessToken);
                setAdminTokens(accessToken, refreshToken);
                window.location.href = getNextPath();
            } catch (e) {
                clearAdminTokens();
                setError(mapError(e.message || '登录失败'));
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '登录后台';
            }
        }

        async function tryAutoEnter() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('reason') === 'expired') {
                setError('登录状态已过期，请重新登录');
            }

            const accessToken = getStoredAdminAccessToken();
            if (accessToken) {
                try {
                    await verifyAdmin(accessToken);
                    window.location.href = getNextPath();
                    return;
                } catch (_) {
                    // ignore and fallback refresh
                }
            }

            const refreshToken = getStoredAdminRefreshToken();
            if (!refreshToken) return;
            try {
                const refreshResp = await fetch('/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: refreshToken, device_id: 'admin_web' }),
                });
                const refreshPayload = await refreshResp.json().catch(() => ({}));
                if (!refreshResp.ok) {
                    clearAdminTokens();
                    return;
                }
                const nextAccess = refreshPayload.access_token || '';
                const nextRefresh = refreshPayload.refresh_token || '';
                if (!nextAccess) {
                    clearAdminTokens();
                    return;
                }
                await verifyAdmin(nextAccess);
                setAdminTokens(nextAccess, nextRefresh || refreshToken);
                window.location.href = getNextPath();
            } catch (_) {
                clearAdminTokens();
            }
        }

        document.getElementById('loginForm').addEventListener('submit', handleSubmit);
        document.getElementById('password').addEventListener('keyup', updateCapsHint);
        document.getElementById('password').addEventListener('keydown', updateCapsHint);
        tryAutoEnter();
    </script>
</body>
</html>
