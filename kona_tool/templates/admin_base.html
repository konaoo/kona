<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Console{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #0f172a;
            --sub: #475569;
            --line: #dbe3ee;
            --primary: #005f73;
            --primary-2: #0a9396;
            --danger: #b42318;
            --ok: #027a48;
            --warn: #b54708;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(160deg, #eef4fb 0%, #f8fbff 45%, #fefcf8 100%);
            color: var(--text);
        }

        .layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: #0b2f3a;
            color: #e8f6f9;
            padding: 20px 14px;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .logo {
            font-weight: 800;
            font-size: 20px;
            margin: 6px 10px 20px;
            letter-spacing: 0.2px;
        }

        .nav a {
            display: block;
            color: #d4eef5;
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .nav a.active {
            background: #104c5e;
            font-weight: 700;
        }

        .nav a:hover {
            background: #155c70;
        }

        .content {
            padding: 22px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .title {
            margin: 0;
            font-size: 22px;
        }

        .hint {
            color: var(--sub);
            font-size: 13px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .kpi {
            font-size: 24px;
            font-weight: 800;
            margin-top: 6px;
        }

        .muted { color: var(--sub); font-size: 13px; }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        input, select, textarea {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 14px;
            background: #fff;
        }

        textarea { min-height: 88px; width: 100%; }

        button {
            border: 0;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            background: var(--primary);
            color: #fff;
        }

        button.secondary { background: #dbe7ef; color: #12313d; }
        button.warn { background: var(--warn); }
        button.danger { background: var(--danger); }
        button.ok { background: var(--ok); }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            text-align: left;
            border-bottom: 1px solid var(--line);
            padding: 8px 6px;
            vertical-align: top;
        }

        .status-pill {
            display: inline-block;
            border-radius: 999px;
            padding: 2px 8px;
            font-size: 12px;
        }

        .status-active { background: #d1fadf; color: #05603a; }
        .status-disabled { background: #fee4e2; color: #912018; }

        #toast {
            position: fixed;
            right: 16px;
            bottom: 16px;
            background: #123;
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            display: none;
            z-index: 9999;
            max-width: 420px;
        }

        #toast.error { background: #7a271a; }

        @media (max-width: 960px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar {
                height: auto;
                position: static;
                border-bottom: 1px solid #21586a;
            }
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }
    </style>
    {% block styles %}{% endblock %}
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">Admin Console</div>
        <nav class="nav">
            <a href="/admin" class="{% if admin_page == 'overview' %}active{% endif %}">总览</a>
            <a href="/admin/users" class="{% if admin_page == 'users' %}active{% endif %}">用户管理</a>
            <a href="/admin/invites" class="{% if admin_page == 'invites' %}active{% endif %}">邀请码</a>
            <a href="/admin/config" class="{% if admin_page == 'config' %}active{% endif %}">配置管理</a>
            <a href="/admin/data" class="{% if admin_page == 'data' %}active{% endif %}">数据管理</a>
            <a href="/admin/apis" class="{% if admin_page == 'apis' %}active{% endif %}">接口测试</a>
            <a href="/admin/audit" class="{% if admin_page == 'audit' %}active{% endif %}">审计日志</a>
            <a href="javascript:void(0);" onclick="adminLogout()">退出登录</a>
            <a href="/" style="margin-top:10px;">返回主站</a>
        </nav>
    </aside>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>
<div id="toast"></div>
<script>
    const ADMIN_ACCESS_KEY = 'admin_access_token';
    const ADMIN_REFRESH_KEY = 'admin_refresh_token';
    const LEGACY_ADMIN_TOKEN_KEYS = ['admin_token', 'token', 'kona_token', 'auth_token', 'jwt_token'];
    const ADMIN_LOGIN_PATH = '/admin/login';
    let _adminRefreshPromise = null;

    function _readStorage(key) {
        return localStorage.getItem(key) || sessionStorage.getItem(key) || '';
    }

    function getAdminAccessToken() {
        const direct = _readStorage(ADMIN_ACCESS_KEY);
        if (direct) return direct;
        for (const key of LEGACY_ADMIN_TOKEN_KEYS) {
            const value = _readStorage(key);
            if (value) return value;
        }
        return '';
    }

    function getAdminRefreshToken() {
        return _readStorage(ADMIN_REFRESH_KEY);
    }

    function setAdminTokens(accessToken, refreshToken) {
        if (accessToken) {
            localStorage.setItem(ADMIN_ACCESS_KEY, accessToken);
            localStorage.setItem('admin_token', accessToken);
        }
        if (refreshToken) {
            localStorage.setItem(ADMIN_REFRESH_KEY, refreshToken);
        }
    }

    function clearAdminTokens({ clearLegacy = false } = {}) {
        const keys = [ADMIN_ACCESS_KEY, ADMIN_REFRESH_KEY, 'admin_token'];
        if (clearLegacy) {
            keys.push(...LEGACY_ADMIN_TOKEN_KEYS);
        }
        for (const key of keys) {
            localStorage.removeItem(key);
            sessionStorage.removeItem(key);
        }
    }

    function toAdminLogin() {
        const next = encodeURIComponent(`${window.location.pathname}${window.location.search}${window.location.hash}`);
        window.location.href = `${ADMIN_LOGIN_PATH}?next=${next}`;
    }

    async function refreshAdminAccessToken() {
        const refreshToken = getAdminRefreshToken();
        if (!refreshToken) {
            return '';
        }
        if (_adminRefreshPromise) {
            return _adminRefreshPromise;
        }
        _adminRefreshPromise = (async () => {
            try {
                const resp = await fetch('/api/auth/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        refresh_token: refreshToken,
                        device_id: 'admin_web',
                    }),
                });
                const payload = await resp.json().catch(() => ({}));
                if (!resp.ok) {
                    return '';
                }
                const nextAccess = (payload && payload.access_token) || '';
                const nextRefresh = (payload && payload.refresh_token) || '';
                if (!nextAccess) {
                    return '';
                }
                setAdminTokens(nextAccess, nextRefresh);
                return nextAccess;
            } catch (_) {
                return '';
            } finally {
                _adminRefreshPromise = null;
            }
        })();
        return _adminRefreshPromise;
    }

    function _isAuthFailure(status, payload) {
        if (status === 401) return true;
        if (status !== 403) return false;
        const msg = (payload && payload.error) ? String(payload.error) : '';
        return [
            'Admin privileges required',
            'Invalid or expired token',
            'Missing Authorization header',
            'User not found',
            'User is disabled',
        ].includes(msg);
    }

    async function adminLogout() {
        const refreshToken = getAdminRefreshToken();
        clearAdminTokens();
        if (refreshToken) {
            try {
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: refreshToken }),
                });
            } catch (_) {
                // ignore
            }
        }
        toAdminLogin();
    }

    function showToast(message, isError = false) {
        const t = document.getElementById('toast');
        t.innerText = message;
        t.className = isError ? 'error' : '';
        t.style.display = 'block';
        setTimeout(() => {
            t.style.display = 'none';
        }, 3200);
    }

    async function adminFetch(url, options = {}, retryOnAuth = true) {
        const headers = new Headers(options.headers || {});
        const body = options.body;
        if (body && !(body instanceof FormData) && !headers.has('Content-Type')) {
            headers.set('Content-Type', 'application/json');
        }
        let token = getAdminAccessToken();
        if (!token) {
            token = await refreshAdminAccessToken();
            if (!token) {
                toAdminLogin();
                throw new Error('请先登录后台');
            }
        }
        headers.set('Authorization', `Bearer ${token}`);

        const resp = await fetch(url, {
            ...options,
            headers,
        });

        const ctype = resp.headers.get('Content-Type') || '';
        const payload = ctype.includes('application/json') ? await resp.json() : await resp.text();

        if (!resp.ok) {
            if (retryOnAuth && resp.status === 401) {
                const nextToken = await refreshAdminAccessToken();
                if (nextToken) {
                    return adminFetch(url, options, false);
                }
            }
            if (_isAuthFailure(resp.status, payload)) {
                clearAdminTokens();
                toAdminLogin();
            }
            const msg = (payload && payload.error) ? payload.error : `HTTP ${resp.status}`;
            throw new Error(msg);
        }
        return payload;
    }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
