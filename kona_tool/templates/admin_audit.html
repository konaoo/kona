{% extends "admin_base.html" %}
{% set admin_page = 'audit' %}

{% block title %}Admin 审计日志{% endblock %}

{% block content %}
<div class="toolbar">
    <h1 class="title">审计日志</h1>
    <div class="hint">所有后台写操作应在此可追踪</div>
</div>

<div class="card">
    <div class="controls">
        <input id="audit_action" placeholder="action（可选）">
        <input id="audit_admin" placeholder="admin_user_id（可选）">
        <input id="audit_limit" type="number" value="200" min="1" max="500" style="width:120px;">
        <button onclick="loadAudit()">查询</button>
    </div>
    <div style="overflow:auto; max-height: 560px;">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>管理员</th>
                    <th>动作</th>
                    <th>目标</th>
                    <th>请求</th>
                    <th>结果</th>
                    <th>错误</th>
                    <th>时间</th>
                </tr>
            </thead>
            <tbody id="auditRows"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function renderAudit(items) {
        const tbody = document.getElementById('auditRows');
        tbody.innerHTML = '';
        if (!items || items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="muted">暂无日志</td></tr>';
            return;
        }
        for (const row of items) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.id || ''}</td>
                <td>${row.admin_user_id || ''}</td>
                <td>${row.action || ''}</td>
                <td>${row.target_type || ''}:${row.target_id || ''}</td>
                <td>${row.method || ''} ${row.path || ''}<br><span class="muted">${row.status_code || ''}</span></td>
                <td>${row.result || ''}</td>
                <td>${row.error || ''}</td>
                <td>${row.created_at || ''}</td>
            `;
            tbody.appendChild(tr);
        }
    }

    async function loadAudit() {
        const action = encodeURIComponent(document.getElementById('audit_action').value.trim());
        const admin = encodeURIComponent(document.getElementById('audit_admin').value.trim());
        const limit = Number(document.getElementById('audit_limit').value || '200');
        const url = `/api/admin/audit/logs?action=${action}&admin_user_id=${admin}&limit=${limit}`;
        try {
            const data = await adminFetch(url);
            renderAudit(data.items || []);
        } catch (e) {
            showToast(`加载失败: ${e.message}`, true);
        }
    }

    loadAudit();
</script>
{% endblock %}
