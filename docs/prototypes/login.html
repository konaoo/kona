<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>登录 · 资产追踪</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0d11;--card:#13151c;--card2:#181b23;
  --border:rgba(255,255,255,0.06);--border-focus:rgba(91,141,239,0.5);--border-err:rgba(240,90,85,0.55);
  --text:#e8eaf0;--text-sub:#8b909f;--text-dim:#4e5464;
  --up:#f05a55;--down:#2ecc8a;--blue:#5b8def;--blue2:#4a7be0;--gold:#d4af64;
  --r:14px;--rs:10px;
}
body{
  background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px 20px;position:relative;overflow:hidden;
}
body::before{content:'';position:fixed;top:-120px;left:50%;transform:translateX(-50%);width:500px;height:500px;background:radial-gradient(circle,rgba(91,141,239,0.07) 0%,transparent 65%);pointer-events:none;}
body::after{content:'';position:fixed;bottom:-80px;right:-60px;width:320px;height:320px;background:radial-gradient(circle,rgba(240,90,85,0.05) 0%,transparent 65%);pointer-events:none;}
.container{width:100%;max-width:380px;position:relative;z-index:1;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Logo */
.logo-area{text-align:center;margin-bottom:36px;animation:fadeUp .5s ease both;}
.logo-icon{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 32px rgba(255,79,123,0.25);overflow:hidden;}

.logo-name{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:4px;}
.logo-sub{font-size:11px;color:var(--text-dim);letter-spacing:.08em;}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 24px 24px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:fadeUp .5s ease .08s both;}

/* Mode tabs */
.mode-tabs{display:flex;background:rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:3px;gap:2px;margin-bottom:24px;}
.mode-tab{flex:1;text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:500;color:rgba(255,255,255,0.4);cursor:pointer;transition:all .18s;user-select:none;}
.mode-tab.active{background:rgba(255,255,255,0.1);color:var(--text);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.5);}

/* Form */
.form-panel{display:none;flex-direction:column;gap:14px;animation:panelIn .22s ease both;}
.form-panel.active{display:flex!important;}
.field{display:flex;flex-direction:column;gap:6px;}
.field-label{font-size:11px;font-weight:500;color:var(--text-sub);letter-spacing:.03em;display:flex;align-items:center;gap:4px;}
.req{width:4px;height:4px;border-radius:50%;background:var(--blue);flex-shrink:0;}

/* Input */
.input-wrap{display:flex;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);transition:border-color .18s,box-shadow .18s;}
.input-wrap:focus-within{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(91,141,239,.08);}
.input-wrap.error{border-color:var(--border-err);box-shadow:0 0 0 3px rgba(240,90,85,.07);}
.inp-icon{padding:0 10px 0 14px;color:var(--text-dim);flex-shrink:0;display:flex;align-items:center;transition:color .18s;}
.input-wrap:focus-within .inp-icon{color:var(--blue);}
input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:12px 12px 12px 0;}
input::placeholder{color:var(--text-dim);font-size:13px;}
.inp-action{padding:0 14px;color:var(--text-dim);cursor:pointer;flex-shrink:0;display:flex;align-items:center;transition:color .15s;}
.inp-action:hover{color:var(--text-sub);}

/* Invite */
.invite-input{font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.12em;text-transform:uppercase;}
.invite-input::placeholder{font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:0;text-transform:none;}
.invite-badge{display:flex;align-items:center;gap:9px;background:rgba(212,175,100,.07);border:1px solid rgba(212,175,100,.2);border-radius:10px;padding:10px 13px;}
.invite-badge-text{font-size:11px;color:var(--gold);line-height:1.5;}

/* Errors */
.field-err{font-size:10px;color:var(--up);display:none;padding-left:2px;}
.field-err.show{display:block;}

/* Agree */

/* Button */
.btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;border:none;border-radius:var(--rs);cursor:pointer;transition:opacity .18s,transform .15s,box-shadow .18s;box-shadow:0 4px 16px rgba(74,123,224,.35);position:relative;overflow:hidden;margin-top:4px;}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);}
.btn:hover{opacity:.92;box-shadow:0 6px 22px rgba(74,123,224,.45);}
.btn:active{transform:scale(.98);}
.btn.loading{opacity:.65;pointer-events:none;}
.btn.success{background:linear-gradient(135deg,#2ecc8a,#25b377);box-shadow:0 4px 16px rgba(46,204,138,.35);}

/* Divider + Social */
.divider{display:flex;align-items:center;gap:12px;margin:2px 0;}
.div-line{flex:1;height:1px;background:var(--border);}
.div-txt{font-size:11px;color:var(--text-dim);white-space:nowrap;}

/* PW strength */
.pw-strength{padding:4px 0 0;}
.pw-bars{display:flex;gap:3px;margin-bottom:3px;}
.pw-bar{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background .25s;}
.pw-bar.weak{background:var(--up);}
.pw-bar.medium{background:#e09030;}
.pw-bar.strong{background:var(--down);}
.pw-lbl{font-size:10px;color:var(--text-dim);}

/* Bottom */
.legal-links{text-align:center;margin-top:20px;margin-bottom:8px;font-size:11px;color:var(--text-dim);line-height:1.6;animation:fadeUp .5s ease .2s both;}
.legal-links span{color:var(--text-sub);border-bottom:1px solid rgba(139,144,159,0.25);cursor:pointer;transition:color .15s;}
.legal-links span:hover{color:var(--blue);}
/* Remember row */

/* Remember + Forgot row */
.remforg-row{display:flex;align-items:center;justify-content:space-between;margin-top:4px;margin-bottom:4px;}
.remember-check{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;}
.remember-box{width:16px;height:16px;border-radius:4px;border:1px solid var(--border);background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,border-color .15s;}
.remember-box.checked{background:var(--blue);border-color:var(--blue);}
.remember-label{font-size:12px;color:var(--text-dim);}
.forgot-link{font-size:12px;color:var(--text-dim);cursor:pointer;transition:color .15s;}
.forgot-link:hover{color:var(--blue);}

/* Invite modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:320px;position:relative;transform:translateY(10px);transition:transform .25s;box-shadow:0 24px 64px rgba(0,0,0,.6);}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);transition:color .15s;}
.modal-close:hover{color:var(--text);}
.modal-title{font-size:15px;font-weight:600;margin-bottom:6px;}
.modal-desc{font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:16px;}
.modal-qr{width:100%;aspect-ratio:1;background:white;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;overflow:hidden;}
.modal-save{width:100%;padding:11px;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);font-size:13px;font-weight:500;color:var(--text-sub);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,color .15s;}
.modal-save:hover{border-color:rgba(255,255,255,.12);color:var(--text);}
.invite-get-code{color:var(--gold);border-bottom:1px solid rgba(212,175,100,.35);cursor:pointer;font-weight:500;transition:opacity .15s;}
.invite-get-code:hover{opacity:.75;}
</style>
</head>
<body>
<div class="container">

  <div class="logo-area">
    <div class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="76" height="76">
        <defs>
          <linearGradient id="kkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF7B54"/>
            <stop offset="50%" stop-color="#FF4F7B"/>
            <stop offset="100%" stop-color="#FF1493"/>
          </linearGradient>
        </defs>
        <rect width="1024" height="1024" rx="225" ry="225" fill="url(#kkGrad)"/>
        <polyline points="222,648 312,376 410,648 512,376 614,648 712,376 802,648"
          fill="none" stroke="white" stroke-opacity="0.95"
          stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="logo-name">咔咔记账</div>
    <div class="logo-sub">一站式管理全市场资产</div>
  </div>

  <div class="card">
    <div class="mode-tabs">
      <div class="mode-tab active" onclick="switchMode('login')">登录</div>
      <div class="mode-tab" onclick="switchMode('register')">注册</div>
    </div>

    <!-- 登录表单 -->
    <div class="form-panel active" id="loginPanel">
      <div class="field">
        <div class="field-label">账号</div>
        <div class="input-wrap" id="loginAccWrap">
          <div class="inp-icon"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3.5"/><path d="M3 18c0-4 3.1-7 7-7s7 3 7 7"/></svg></div>
          <input id="loginAcc" type="text" placeholder="请输入用户名">
        </div>
        <div class="field-err" id="loginAccErr">请输入用户名</div>
      </div>
      <div class="field">
        <div class="field-label">密码</div>
        <div class="input-wrap" id="loginPwWrap">
          <div class="inp-icon"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="14" height="10" rx="2"/><path d="M7 9V6a3 3 0 016 0v3"/></svg></div>
          <input id="loginPw" type="password" placeholder="请输入密码">
          <div class="inp-action" onclick="togglePw('loginPw',this)"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 10s4-7 9-7 9 7 9 7-4 7-9 7-9-7-9-7z"/><circle cx="10" cy="10" r="2.5"/></svg></div>
        </div>
        <div class="field-err" id="loginPwErr">请输入密码</div>
      </div>
      <div class="remforg-row">
        <div class="remember-check" onclick="toggleRemember()">
          <div class="remember-box" id="rememberBox">
            <svg id="rememberCheck" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0;transition:opacity .15s"><path d="M1.5 5l2.5 2.5 4.5-4"/></svg>
          </div>
          <span class="remember-label">记住用户名</span>
        </div>
        <span class="forgot-link">忘记密码？</span>
      </div>
      <button class="btn" id="loginBtn" onclick="handleLogin()">登录</button>
    </div>

    <!-- 注册表单 -->
    <div class="form-panel" id="registerPanel">
      <div class="invite-badge">
        <span style="font-size:16px">&#128273;</span>
        <span class="invite-badge-text">当前注册仅限受邀用户，<span class="invite-get-code" onclick="openInviteModal()">获取邀请码</span></span>
      </div>
      <div class="field">
        <div class="field-label"><span class="req"></span>邀请码</div>
        <div class="input-wrap" id="regInvWrap">
          <div class="inp-icon"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
          <input id="regInv" class="invite-input" type="text" placeholder="输入邀请码" maxlength="8" oninput="this.value=this.value.toUpperCase()">
        </div>
        <div class="field-err" id="regInvErr">请输入有效的邀请码</div>
      </div>
      <div class="field">
        <div class="field-label"><span class="req"></span>用户名 / 账号</div>
        <div class="input-wrap" id="regAccWrap">
          <div class="inp-icon"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3.5"/><path d="M3 18c0-4 3.1-7 7-7s7 3 7 7"/></svg></div>
          <input id="regAcc" type="text" placeholder="请输入用户名">
        </div>
        <div class="field-err" id="regAccErr">请输入用户名</div>
      </div>
      <div class="field">
        <div class="field-label"><span class="req"></span>设置密码</div>
        <div class="input-wrap" id="regPwWrap">
          <div class="inp-icon"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="14" height="10" rx="2"/><path d="M7 9V6a3 3 0 016 0v3"/></svg></div>
          <input id="regPw" type="password" placeholder="至少 8 位，含字母和数字" oninput="checkPwStr(this.value)">
          <div class="inp-action" onclick="togglePw('regPw',this)"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 10s4-7 9-7 9 7 9 7-4 7-9 7-9-7-9-7z"/><circle cx="10" cy="10" r="2.5"/></svg></div>
        </div>
        <div class="pw-strength" id="pwStr" style="display:none">
          <div class="pw-bars"><div class="pw-bar" id="b1"></div><div class="pw-bar" id="b2"></div><div class="pw-bar" id="b3"></div></div>
          <div class="pw-lbl" id="pwLbl"></div>
        </div>
        <div class="field-err" id="regPwErr">密码至少 8 位</div>
      </div>
      <div class="field">
        <div class="field-label"><span class="req"></span>确认密码</div>
        <div class="input-wrap" id="regPw2Wrap">
          <div class="inp-icon"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="14" height="10" rx="2"/><path d="M7 9V6a3 3 0 016 0v3"/></svg></div>
          <input id="regPw2" type="password" placeholder="再次输入密码">
          <div class="inp-action" onclick="togglePw('regPw2',this)"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 10s4-7 9-7 9 7 9 7-4 7-9 7-9-7-9-7z"/><circle cx="10" cy="10" r="2.5"/></svg></div>
        </div>
        <div class="field-err" id="regPw2Err">两次密码不一致</div>
      </div>
      <button class="btn" id="regBtn" onclick="handleRegister()">创建账户</button>
    </div>
  </div>

  <div class="legal-links">登录或注册即代表您同意 <span>用户协议</span> 和 <span>隐私政策</span></div>

</div>

        <rect x="176" y="140" width="8" height="8" fill="black"/>
        <rect x="80" y="152" width="8" height="8" fill="black"/>
        <rect x="116" y="152" width="8" height="8" fill="black"/>
        <rect x="140" y="152" width="8" height="8" fill="black"/>
        <rect x="164" y="152" width="8" height="8" fill="black"/>
        <rect x="92" y="164" width="8" height="8" fill="black"/>
        <rect x="116" y="164" width="8" height="8" fill="black"/>
        <rect x="152" y="164" width="8" height="8" fill="black"/>
        <rect x="176" y="164" width="8" height="8" fill="black"/>
        <rect x="80" y="176" width="8" height="8" fill="black"/>
        <rect x="104" y="176" width="8" height="8" fill="black"/>
        <rect x="128" y="176" width="8" height="8" fill="black"/>
        <rect x="164" y="176" width="8" height="8" fill="black"/>
        <!-- wechat logo in center -->
        <rect x="88" y="88" width="24" height="24" rx="4" fill="#07C160"/>
        <text x="100" y="104" text-anchor="middle" font-size="14" fill="white" font-family="sans-serif">W</text>
      </svg>
    </div>
    <div class="modal-save" onclick="saveQrCode()">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h14M10 3v10M6 9l4 4 4-4"/></svg>
      保存二维码
    </div>
  </div>
</div>

<script>
// ── Tab 切换 ──
function switchMode(m) {
  document.querySelectorAll('.mode-tab').forEach((t,i) =>
    t.classList.toggle('active', (i===0&&m==='login')||(i===1&&m==='register'))
  );
  document.getElementById('loginPanel').classList.toggle('active', m==='login');
  document.getElementById('registerPanel').classList.toggle('active', m==='register');
  clearErr();
}

// ── 记住用户名 ──
let rememberEnabled = false;
function toggleRemember() {
  rememberEnabled = !rememberEnabled;
  const box   = document.getElementById('rememberBox');
  const check = document.getElementById('rememberCheck');
  box.classList.toggle('checked', rememberEnabled);
  check.style.opacity = rememberEnabled ? '1' : '0';
  if (rememberEnabled) {
    const acc = document.getElementById('loginAcc').value.trim();
    if (acc) localStorage.setItem('kk_username', acc);
  } else {
    localStorage.removeItem('kk_username');
  }
}
(function() {
  const saved = localStorage.getItem('kk_username');
  if (saved) {
    const el = document.getElementById('loginAcc');
    if (el) el.value = saved;
    rememberEnabled = true;
    const box   = document.getElementById('rememberBox');
    const check = document.getElementById('rememberCheck');
    if (box)   box.classList.add('checked');
    if (check) check.style.opacity = '1';
  }
})();

// ── 邀请码弹窗 ──
function openInviteModal() {
  document.getElementById('inviteModal').classList.add('open');
}
function closeInviteModal() {
  document.getElementById('inviteModal').classList.remove('open');
}
function closeInviteOnOverlay(e) {
  if (e.target === document.getElementById('inviteModal')) closeInviteModal();
}
function saveQrCode() {
  const svg = document.querySelector('#modalQr svg');
  if (!svg) return;
  const data = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([data], {type:'image/svg+xml'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = '咔咔记账邀请码二维码.svg';
  a.click(); URL.revokeObjectURL(url);
}

// ── 密码显示切换 ──
function togglePw(id, btn) {
  const el   = document.getElementById(id);
  const show = el.type === 'password';
  el.type    = show ? 'text' : 'password';
  btn.style.color = show ? 'var(--blue)' : '';
}

// ── 密码强度 ──
function checkPwStr(v) {
  const el = document.getElementById('pwStr');
  if (!v) { el.style.display='none'; return; }
  el.style.display = 'block';
  let s = 0;
  if (v.length >= 8) s++;
  if (/[A-Za-z]/.test(v) && /[0-9]/.test(v)) s++;
  if (/[^A-Za-z0-9]/.test(v) || v.length >= 12) s++;
  const cols = ['weak','medium','strong'];
  const lbls = ['强度：弱','强度：中','强度：强'];
  ['b1','b2','b3'].forEach((id,i) => {
    const b = document.getElementById(id);
    b.className = 'pw-bar';
    if (i < s) b.classList.add(cols[s-1] || 'weak');
  });
  document.getElementById('pwLbl').textContent = lbls[s-1] || '';
}

// ── 错误处理 ──
function clearErr() {
  document.querySelectorAll('.field-err').forEach(e => e.classList.remove('show'));
  document.querySelectorAll('.input-wrap').forEach(w => w.classList.remove('error'));
}
function setErr(wid, eid, msg) {
  document.getElementById(wid).classList.add('error');
  const e = document.getElementById(eid);
  e.textContent = msg;
  e.classList.add('show');
}

// ── 登录 ──
function handleLogin() {
  clearErr();
  const a = document.getElementById('loginAcc').value.trim();
  const p = document.getElementById('loginPw').value;
  let ok = true;
  if (!a) { setErr('loginAccWrap','loginAccErr','请输入用户名'); ok=false; }
  if (!p) { setErr('loginPwWrap','loginPwErr','请输入密码');   ok=false; }
  if (!ok) return;
  if (rememberEnabled && a) localStorage.setItem('kk_username', a);
  const btn = document.getElementById('loginBtn');
  btn.textContent = '登录中…'; btn.classList.add('loading');
  setTimeout(() => {
    btn.classList.remove('loading'); btn.classList.add('success');
    btn.textContent = '✓ 登录成功';
    setTimeout(() => { btn.textContent='登录'; btn.classList.remove('success'); }, 2000);
  }, 1200);
}

// ── 注册 ──
function handleRegister() {
  clearErr();
  const inv = document.getElementById('regInv').value.trim();
  const acc = document.getElementById('regAcc').value.trim();
  const pw  = document.getElementById('regPw').value;
  const pw2 = document.getElementById('regPw2').value;
  let ok = true;
  if (!inv || inv.length < 4) { setErr('regInvWrap','regInvErr','邀请码格式不正确'); ok=false; }
  if (!acc) { setErr('regAccWrap','regAccErr','请输入用户名'); ok=false; }
  if (!pw || pw.length < 8)  { setErr('regPwWrap','regPwErr','密码至少 8 位');     ok=false; }
  else if (pw !== pw2)       { setErr('regPw2Wrap','regPw2Err','两次密码不一致');  ok=false; }
  if (!ok) return;
  const btn = document.getElementById('regBtn');
  btn.textContent = '注册中…'; btn.classList.add('loading');
  setTimeout(() => {
    btn.classList.remove('loading'); btn.classList.add('success');
    btn.textContent = '✓ 注册成功';
    setTimeout(() => {
      btn.textContent = '创建账户'; btn.classList.remove('success');
      switchMode('login');
    }, 1800);
  }, 1400);
}
</script>
</body>
</html>
