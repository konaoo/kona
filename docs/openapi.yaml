openapi: 3.0.3
info:
  title: Kaka Portfolio API
  version: "v12.0.0"
  description: API for the Kaka portfolio management system
servers:
  - url: http://114.132.238.12
  - url: http://127.0.0.1:5003
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    StatusOk:
      type: object
      properties:
        status:
          type: string
          example: ok
    RequestRuntimeMetrics:
      type: object
      properties:
        policy_rate_allowed:
          type: integer
        policy_rate_limited:
          type: integer
        policy_rate_errors:
          type: integer
        activity_touch_write:
          type: integer
        activity_touch_skipped:
          type: integer
        activity_touch_errors:
          type: integer
        storage_errors:
          type: integer
        last_error:
          type: string
        last_error_at:
          type: number
        storage:
          type: object
          properties:
            backend:
              type: string
            shared:
              type: boolean
        activity_touch_interval_seconds:
          type: number
        policy_rate_ttl_seconds:
          type: number
    PriceCacheStats:
      type: object
      properties:
        size:
          type: integer
        max_size:
          type: integer
        evictions:
          type: integer
        ttl:
          type: integer
        stale_ttl:
          type: integer
    PriceRuntimeMetrics:
      type: object
      properties:
        cache_hits:
          type: integer
        stale_hits:
          type: integer
        network_fetch:
          type: integer
        network_fail:
          type: integer
        last_fetch_at:
          type: number
        cache:
          $ref: "#/components/schemas/PriceCacheStats"
    PriceSourceHealthItem:
      type: object
      properties:
        ok:
          type: integer
        fail:
          type: integer
        timeout:
          type: integer
        consecutive_fail:
          type: integer
        latency_avg_ms:
          type: number
        last_error:
          type: string
        last_ok_at:
          type: string
        last_fail_at:
          type: string
        circuit_open_until:
          type: number
        circuit_open:
          type: boolean
    PriceSourceHealthMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/PriceSourceHealthItem"
    PnlOverviewItem:
      type: object
      properties:
        pnl:
