paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
                  request_runtime:
                    $ref: "#/components/schemas/RequestRuntimeMetrics"
  /api/rates:
    get:
      summary: Get FX rates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
  /api/price:
    get:
      summary: Get a single price
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  price:
                    type: number
                  yclose:
                    type: number
                  amt:
                    type: number
                  chg:
                    type: number
        "400":
          description: Missing code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/prices/batch:
    post:
      summary: Get batch prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codes:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    price:
                      type: number
                    yclose:
                      type: number
                    amt:
                      type: number
                    chg:
                      type: number
  /api/portfolio:
    get:
      summary: Get portfolio
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum: [all, stock_cn, stock_us, stock_hk, fund]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    name:
                      type: string
                    qty:
                      type: number
                    price:
                      type: number
                    curr:
                      type: string
                    adjustment:
                      type: number
  /api/portfolio/add:
    post:
      summary: Add asset
      security:
        - bearerAuth: []
      requestBody:
        required: true
